<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login — TechPrep AI</title>
  <meta name="description" content="Sign in to your TechPrep AI account to access DSA roadmaps, ATS resume designer, and placement tracking.">

  <!-- Inter & JetBrains Mono Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              900: '#1e3a8a',
            }
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="css/styles.css">

  <script src="js/theme.js"></script>
</head>

<body class="bg-surface-primary text-neutral-900 dark:text-neutral-100 min-h-screen flex flex-col justify-between antialiased selection:bg-blue-500 selection:text-white bg-grid-pattern">

  <!-- Minimal Header -->
  <header class="w-full border-b border-neutral-200 dark:border-neutral-800 bg-surface-primary/90 subtle-glass sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <a href="index.html" class="flex items-center space-x-2.5">
        <div class="w-8 h-8 rounded-lg bg-neutral-900 dark:bg-white text-white dark:text-neutral-950 flex items-center justify-center font-mono font-bold text-sm shadow-sm">
          TP
        </div>
        <span class="font-bold text-base tracking-tight font-sans">TechPrep <span class="text-blue-600 dark:text-blue-500">AI</span></span>
      </a>

      <!-- Theme Switcher Button -->
      <button class="theme-toggle-btn p-2 rounded-lg bg-neutral-100 dark:bg-neutral-800 text-neutral-700 dark:text-neutral-300 hover:text-neutral-900 dark:hover:text-white border border-neutral-200 dark:border-neutral-700 transition-colors flex items-center space-x-1.5 text-xs font-medium" title="Toggle Light / Dark mode">
        <svg class="w-4 h-4 hidden dark:block text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
        </svg>
        <svg class="w-4 h-4 block dark:hidden text-slate-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
        </svg>
        <span class="text-[11px] font-mono">Theme</span>
      </button>
    </div>
  </header>

  <!-- Login Card Container -->
  <main class="flex-1 flex items-center justify-center p-4 py-12">
    <div class="w-full max-w-md p-6 sm:p-8 rounded-xl border border-neutral-200 dark:border-neutral-800 bg-surface-elevated shadow-2xl space-y-6 text-left">
      
      <div class="space-y-1">
        <h1 class="text-2xl font-extrabold tracking-tight text-neutral-900 dark:text-white">Welcome Back</h1>
        <p class="text-xs text-neutral-500">Sign in to access your student placement prep dashboard</p>
      </div>

      <!-- Feedback Error / Status Message Container -->
      <div id="login-error-msg" class="hidden p-3 rounded-lg border text-xs font-medium"></div>

      <!-- Standalone Login Form -->
      <form id="standalone-login-form" class="space-y-4 text-xs">
        <div>
          <label for="login-email" class="block text-neutral-700 dark:text-neutral-300 font-medium mb-1">Email Address</label>
          <input type="email" id="login-email" required placeholder="student@college.edu"
            class="w-full p-3 rounded-lg border border-neutral-300 dark:border-neutral-700 bg-surface-secondary text-neutral-900 dark:text-white focus:outline-none focus:ring-1 focus:ring-blue-500">
        </div>

        <div>
          <div class="flex items-center justify-between mb-1">
            <label for="login-password" class="block text-neutral-700 dark:text-neutral-300 font-medium">Password</label>
            <a href="#" onclick="alert('Password reset link sent to your email.'); return false;" class="text-[11px] text-blue-500 hover:underline">Forgot password?</a>
          </div>
          <input type="password" id="login-password" required placeholder="••••••••"
            class="w-full p-3 rounded-lg border border-neutral-300 dark:border-neutral-700 bg-surface-secondary text-neutral-900 dark:text-white focus:outline-none focus:ring-1 focus:ring-blue-500">
        </div>

        <div class="flex items-center space-x-2 pt-1">
          <input type="checkbox" id="remember-me" class="rounded border-neutral-300 text-blue-600 focus:ring-blue-500">
          <label for="remember-me" class="text-xs text-neutral-600 dark:text-neutral-400">Remember me on this device</label>
        </div>

        <button type="submit"
          class="w-full py-3.5 px-6 rounded-lg bg-neutral-900 text-white dark:bg-white dark:text-neutral-950 font-semibold text-xs hover:bg-neutral-800 dark:hover:bg-neutral-100 transition-colors shadow-sm">
          Sign In
        </button>
      </form>

      <div class="text-center text-xs text-neutral-500 pt-4 border-t border-neutral-200 dark:border-neutral-800">
        Don't have an account yet? <a href="signup.html" class="text-blue-500 font-semibold hover:underline">Create free account</a>
      </div>

    </div>
  </main>

  <!-- Minimal Footer -->
  <footer class="py-6 text-center text-xs text-neutral-500 border-t border-neutral-200 dark:border-neutral-800 bg-surface-primary">
    © 2026 TechPrep AI, Inc. All rights reserved. • <a href="index.html" class="hover:underline">Back to Home</a>
  </footer>

  <script src="js/app.js"></script>
</body>

</html>
